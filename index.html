<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error Log Helper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --panel: #111827;
      --muted: #9ca3af;
      --border: #1f2937;
      --accent: #38bdf8;
      --accent-strong: #22d3ee;
      --text: #e5e7eb;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(34,211,238,0.08), transparent 25%),
                  radial-gradient(circle at 80% 0%, rgba(56,189,248,0.1), transparent 30%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 20px 60px;
      display: flex;
      justify-content: center;
    }
    main {
      width: min(1100px, 100%);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 3vw, 36px);
      letter-spacing: -0.02em;
    }
    .tagline {
      color: var(--muted);
      margin: 0;
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }
    .card {
      background: linear-gradient(145deg, rgba(17,24,39,0.9), rgba(15,23,42,0.94));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }
    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      min-height: 260px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      padding: 14px 12px;
      font: 14px/1.5 "Inter", monospace;
      resize: vertical;
      transition: border 0.15s ease, box-shadow 0.15s ease;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(56,189,248,0.2);
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s;
      color: #0b1220;
      background: linear-gradient(120deg, var(--accent), var(--accent-strong));
      box-shadow: 0 10px 25px rgba(34,211,238,0.35);
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: none;
    }
    button:active {
      transform: translateY(1px);
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
    }
    .results {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }
    .result {
      display: grid;
      gap: 4px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0c1220;
    }
    .result a {
      color: var(--accent-strong);
      text-decoration: none;
      font-weight: 600;
    }
    .result a:hover { text-decoration: underline; }
    .meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      margin-top: 10px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }
    .empty {
      color: var(--muted);
      font-size: 14px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    @media (max-width: 640px) {
      body { padding: 20px 16px 40px; }
      textarea { min-height: 200px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Error Log Helper</h1>
        <p class="tagline">Paste a stack trace and jump straight to relevant Stack Overflow answers.</p>
      </div>
      <p class="tagline">Shortcut: Ctrl/Cmd + Enter</p>
    </header>

    <div class="grid">
      <section class="card">
        <label for="log">
          Error log / stack trace
          <span class="hint">Keep PII out of logs</span>
        </label>
        <textarea id="log" placeholder="Paste your error log here..."></textarea>
        <div class="actions">
          <button id="searchBtn">Find suggestions</button>
          <button class="secondary" id="clearBtn">Clear</button>
        </div>
        <p class="hint">We search Stack Overflow using extracted keywords from your log. No data is stored.</p>
      </section>

      <section class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <h2 style="margin:0; font-size:18px;">Suggested links</h2>
          <span class="status" id="status">
            <span class="dot" hidden></span>
            <span id="statusText">Idle</span>
          </span>
        </div>
        <div class="results" id="results">
          <div class="empty">Paste a log and click “Find suggestions”.</div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const BACKEND_URL = window.BACKEND_URL || "http://localhost:8000";
    const textarea = document.getElementById("log");
    const searchBtn = document.getElementById("searchBtn");
    const clearBtn = document.getElementById("clearBtn");
    const resultsEl = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const dotEl = statusEl.querySelector(".dot");
    const statusText = document.getElementById("statusText");

    function setStatus(text, loading = false) {
      statusText.textContent = text;
      dotEl.hidden = !loading;
    }

    function renderResults(data) {
      const items = data.results || [];
      const query = data.query || "";
      const highlights = data.highlights || [];
      const localMatches = data.local_matches || [];
      resultsEl.innerHTML = "";
      if (highlights.length) {
        const tagWrap = document.createElement("div");
        tagWrap.className = "result";
        tagWrap.innerHTML = `
          <div class="meta" style="gap:6px;">
            <span>Top error lines:</span>
            ${highlights
              .map((h) => `<span style="background:#0f172a; padding:4px 8px; border-radius:6px; border:1px solid var(--border);">${h}</span>`)
              .join("")}
          </div>
        `;
        resultsEl.appendChild(tagWrap);
      }
      if (localMatches.length) {
        const localCard = document.createElement("div");
        localCard.className = "result";
        localCard.innerHTML = `
          <div style="font-weight:600; margin-bottom:6px;">Local knowledge matches</div>
          ${localMatches
            .map(
              (m) => `
                <div style="margin-bottom:8px; border-bottom:1px solid var(--border); padding-bottom:8px;">
                  <div style="font-weight:600;">${m.issue}</div>
                  <div class="meta" style="margin:6px 0;">Tags: ${m.tags?.join(", ") || "none"} • Score: ${m.score.toFixed(3)}</div>
                  <div style="color: var(--muted); line-height:1.5;">${m.answer}</div>
                </div>
              `
            )
            .join("")}
        `;
        resultsEl.appendChild(localCard);
      }
      if (!items.length) {
        resultsEl.innerHTML = `
          <div class="empty">
            No direct matches from the API. Try opening a search:
            <div style="margin-top:8px;">
              <a href="https://stackoverflow.com/search?q=${encodeURIComponent(query)}" target="_blank" rel="noreferrer">
                Search Stack Overflow for “${query}”
              </a>
            </div>
          </div>`;
        return;
      }

      for (const item of items) {
        const card = document.createElement("div");
        card.className = "result";
        card.innerHTML = `
          <a href="${item.link}" target="_blank" rel="noreferrer">${item.title}</a>
          <div class="meta">
            <span>Score: ${item.score}</span>
            <span>Answers: ${item.answer_count}</span>
            <span>${item.is_answered ? "✅ Answered" : "❓ Unanswered"}</span>
          </div>
        `;
        resultsEl.appendChild(card);
      }
    }

    async function search() {
      const log = textarea.value.trim();
      if (!log) {
        textarea.focus();
        return;
      }

      setStatus("Searching…", true);

      try {
        const res = await fetch(`${BACKEND_URL}/analyze`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ log, top_k: 8 }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || "API error");
        }
        const data = await res.json();
        renderResults(data);
        setStatus("Done");
      } catch (err) {
        console.error(err);
        const fallbackQuery = log.split(/\s+/).slice(0, 6).join(" ");
        resultsEl.innerHTML = `
          <div class="empty">
            Could not reach the backend. Your connection may block it.
            <div style="margin-top:8px;">
              <a href="https://stackoverflow.com/search?q=${encodeURIComponent(fallbackQuery)}" target="_blank" rel="noreferrer">
                Open search in browser
              </a>
            </div>
          </div>`;
        setStatus("Offline?");
      } finally {
        setTimeout(() => setStatus("Idle"), 1400);
      }
    }

    searchBtn.addEventListener("click", search);
    clearBtn.addEventListener("click", () => {
      textarea.value = "";
      resultsEl.innerHTML = '<div class="empty">Paste a log and click “Find suggestions”.</div>';
      setStatus("Cleared");
      textarea.focus();
    });
    textarea.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
        search();
      }
    });
  </script>
</body>
</html>
